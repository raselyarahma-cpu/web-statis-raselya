!DOCTYPE html>
<html lang="id">
  <head>
    <title>Data Siswa</title>
  </head>
  <body>
    <!-- 1. FORM INPUT DATA SISWA -->
    <h2>Tambah Data Siswa</h2>
    <form>
      <p>
        <label>NIS:</label><br />
        <input type="text" placeholder="Masukkan NIS" />
      </p>
      <p>
        <label>Nama Lengkap:</label><br />
        <input type="text" placeholder="Masukkan Nama" />
      </p>
      <p>
        <label>Kelas:</label><br />
        <select>
          <option>Pilih Kelas</option>
          <option>XI RPL 3</option>
          <option>X TSM 1</option>
        </select>
      </p>
      <p>
        <label>Jenis Kelamin:</label><br />
        <input type="radio" name="jk" checked /> Laki-laki
        <input type="radio" name="jk" /> Perempuan
      </p>
      <p>
        <label>Tanggal Lahir:</label><br />
        <input type="date" />
      </p>
      <button type="submit">Simpan</button> <button type="reset">Reset</button>
    </form>
    <hr />
  </body>
</html>
